name: OpenWrt Builder

on:
  repository_dispatch:
    types: [auto-build-firmware]
  workflow_dispatch:
    inputs:
      build_version:
        description: 'Build Version'
        required: true
        default: 'padavanonly/immortalwrt-mt798x-6.6'
        type: choice
        options:
          - padavanonly/immortalwrt-mt798x-6.6
          - Muffinbit/immortalwrt
          - Muffinbit/openwrt
      lan_ip:
        description: 'Set LAN IP Address'
        required: false
        default: '192.168.10.1'
      ssh:
        description: 'Connect to Actions via SSH'
        required: false
        default: false
        type: boolean

env:
  REPO_URL: https://github.com/${{ github.event.inputs.build_version }}
  REPO_BRANCH: ${{ github.event.inputs.build_version == 'padavanonly/immortalwrt-mt798x-6.6' && 'openwrt-24.10-6.6' || github.event.inputs.build_version == 'Muffinbit/openwrt' && 'main' || 'master' }}
  SYSTEM_VERSION: ${{ github.event.inputs.build_version == 'padavanonly/immortalwrt-mt798x-6.6' && 'immortalwrt 24.10' || github.event.inputs.build_version == 'Muffinbit/openwrt' && 'openwrt 24.10.3' || 'immortalwrt 24.10' }}
  KERNEL_VERSION: ${{ github.event.inputs.build_version == 'padavanonly/immortalwrt-mt798x-6.6' && '6.6' || '6.12' }}
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: ${{ github.event.inputs.build_version == 'padavanonly/immortalwrt-mt798x-6.6' && 'immortalwrt-mt798x-6.6.config' || github.event.inputs.build_version == 'Muffinbit/openwrt' && 'openwrt.config' || 'immortalwrt.config' }}
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  DEFAULT_LAN: ${{ github.event.inputs.build_version == 'padavanonly/immortalwrt-mt798x-6.6' && '192.168.6.1' || '192.168.1.1' }}
  LAN_IP: ${{ github.event.inputs.lan_ip }}
  DEFAULT_HOSTNAME: ${{ github.event.inputs.build_version == 'Muffinbit/openwrt' && 'OpenWrt' || 'ImmortalWrt' }}
  SSH: ${{ format('{0}', github.event.inputs.ssh) }}
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    outputs:
      deviceName: ${{ steps.compile.outputs.deviceName }}
      fileDate:   ${{ steps.compile.outputs.fileDate }}

    steps:
      # ====================== System Preparation ======================
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Diagnose Disk Layout
        run: |
          echo "🩺 Initial Disk Layout:"
          df -hT
          echo ""
          echo "🔍 Top-level directories on / (top 20):"
          sudo du -xh / --max-depth=1 2>/dev/null | sort -rh | head -20 || true
          echo ""
          echo "🔍 Files >1G on /:"
          sudo find / -xdev -type f -size +1G 2>/dev/null -exec ls -lh {} \; \
            | awk '{print $5, $9}' || true
          echo ""
          echo "🔍 Loop devices:"
          sudo losetup -a || true

      - name: Redirect apt/dpkg to LVM and reset /tmp
        run: |
          set -uo pipefail

          # ---- 1) 把 /tmp 换成全新的 tmpfs,强制 1777 权限 ----
          if mountpoint -q /tmp; then
            sudo umount /tmp || true
          fi
          # 清空残留文件 (旧索引/临时 apt-key 文件)
          sudo find /tmp -mindepth 1 -maxdepth 1 -exec rm -rf {} + 2>/dev/null || true
          sudo mount -t tmpfs -o size=4G,mode=1777,nosuid,nodev tmpfs /tmp
          echo "✅ /tmp remounted as tmpfs:"
          ls -ld /tmp
          df -hT /tmp

          # ---- 2) apt/dpkg 子目录 -> workspace LVM ----
          AVAIL_GB="$(df -BG --output=avail "$GITHUB_WORKSPACE" | tail -1 | tr -dc '0-9')"
          echo "Workspace available: ${AVAIL_GB}G"
          if [ "$AVAIL_GB" -lt 30 ]; then
            echo "::error::Workspace only has ${AVAIL_GB}G free, need >=30G"
            exit 1
          fi

          CACHE_ROOT="$GITHUB_WORKSPACE/.ci-cache"
          sudo rm -rf "$CACHE_ROOT"
          sudo mkdir -p \
            "$CACHE_ROOT/apt-lists" \
            "$CACHE_ROOT/apt-archives" \
            "$CACHE_ROOT/dpkg-updates"
          sudo chown -R "$USER:$USER" "$CACHE_ROOT"

          # 清空原目录, 避免上次失败留下的坏索引再次干扰
          sudo rm -rf /var/lib/apt/lists/*       || true
          sudo rm -rf /var/cache/apt/archives/*  || true
          sudo rm -rf /var/lib/dpkg/updates/*    || true

          sudo mount --bind "$CACHE_ROOT/apt-lists"    /var/lib/apt/lists
          sudo mount --bind "$CACHE_ROOT/apt-archives" /var/cache/apt/archives
          sudo mount --bind "$CACHE_ROOT/dpkg-updates" /var/lib/dpkg/updates

          # ---- 3) 验证挂载点存在、可写 ----
          echo "✅ After redirect:"
          df -hT / /tmp /var/lib/apt/lists /var/cache/apt/archives /var/lib/dpkg/updates
          ls -ld /tmp /var/lib/apt/lists /var/cache/apt/archives /var/lib/dpkg/updates

          echo "🔍 Verify _apt can write to /tmp:"
          sudo -u _apt touch /tmp/.apt-write-test 2>/dev/null \
            && echo "  ✅ _apt can write /tmp" \
            || { echo "  ::error::_apt cannot write /tmp"; exit 1; }
          sudo rm -f /tmp/.apt-write-test

          echo "🔍 Verify apt can create config files in /tmp:"
          if ! sudo -u root bash -c 'echo x > /tmp/.apt-test'; then
            echo "::error::root cannot write /tmp"
            exit 1
          fi
          sudo rm -f /tmp/.apt-test
          echo "  ✅ /tmp is usable by apt"

      - name: Repair dpkg State
        run: |
          sudo rm -rf /var/lib/dpkg/updates/* || true
          sudo rm -rf /tmp/apt-dpkg-install-* || true
          sudo dpkg --configure -a || true
          sudo apt-get -f install -y || true

      - name: Check System Resources
        run: |
          echo "💻 CPU Information:"
          echo "--------------------------------------"
          echo "CPU Cores: $(nproc)"
          echo "CPU Model: $(lscpu | grep 'Model name' | cut -d':' -f2 | sed 's/^ *//')"
          echo ""
          echo "🧠 Memory Information:"
          echo "--------------------------------------"
          free -h
          echo ""
          echo "💾 Disk Information:"
          echo "--------------------------------------"
          df -hT

      # ====================== Environment Setup ======================
      - name: Initialize Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          echo "📦 Installing build dependencies..."
          sudo apt-get -qq update
          sudo apt-get -qq install -y --no-install-recommends \
            ack antlr3 autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
            gcc-multilib g++-multilib gettext xorriso git gperf haveged help2man \
            intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev \
            libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev \
            libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool \
            llvm lrzsz msmtp ninja-build p7zip p7zip-full patch pkgconf python3 \
            python3-pyelftools python3-setuptools qemu-utils rsync scons \
            squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim \
            wget xxd zlib1g-dev

          echo "🧹 Cleaning system..."
          sudo apt-get -qq autoremove --purge
          sudo apt-get -qq clean

          echo "⏰ Setting timezone to $TZ..."
          sudo timedatectl set-timezone "$TZ" || true

          echo "💾 Disk after install:"
          df -hT / /tmp "$GITHUB_WORKSPACE"

      # ====================== Source Code Processing ======================
      - name: Clone Source Code
        run: |
          echo "📥 Cloning $REPO_URL ($REPO_BRANCH)..."
          rm -rf openwrt
          git clone --branch="$REPO_BRANCH" --depth=1 "$REPO_URL" openwrt

      - name: Load Custom Feeds
        run: |
          if [ -e "$FEEDS_CONF" ]; then
            echo "🔄 Loading custom feeds configuration..."
            mv "$FEEDS_CONF" openwrt/feeds.conf.default
          fi
          if [ -e "$DIY_P1_SH" ]; then
            echo "🔧 Executing custom script Part 1..."
            chmod +x "$DIY_P1_SH"
            ( cd openwrt && "../$DIY_P1_SH" )
          else
            echo "⚠️ $DIY_P1_SH not found, skipping"
          fi

      - name: Update Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a

      - name: Install Feeds
        run: |
          cd openwrt
          ./scripts/feeds install -a

      - name: Load Custom Configuration
        run: |
          if [ -e "files" ]; then
            echo "📁 Loading custom files..."
            mv files openwrt/files
          fi
          if [ -e "$CONFIG_FILE" ]; then
            echo "⚙️ Loading custom configuration..."
            mv "$CONFIG_FILE" openwrt/.config
          fi
          if [ -e "$DIY_P2_SH" ]; then
            echo "🔧 Executing custom script Part 2..."
            chmod +x "$DIY_P2_SH"
            ( cd openwrt && "../$DIY_P2_SH" )
          else
            echo "⚠️ $DIY_P2_SH not found, skipping"
          fi

      # ====================== SSH Connection Option ======================
      - name: SSH to Actions
        if: (github.event.inputs.ssh == 'true' && github.event.inputs.ssh != 'false') || contains(github.event.action, 'ssh')
        uses: P3TERX/ssh2actions@main
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # ====================== Compilation Phase ======================
      - name: Download Packages
        run: |
          cd openwrt
          make defconfig
          make download -j"$(nproc)" || make download -j1
          find dl -size -1024c -delete

      - name: Compile Firmware
        id: compile
        run: |
          cd openwrt
          THREADS=$(( $(nproc) * 3 / 2 ))
          echo "🔧 Compiling with $THREADS threads..."
          if ! make -j"$THREADS"; then
            echo "⚠️ First attempt failed, retrying -j1 ..."
            if ! make -j1; then
              echo "⚠️ Second attempt failed, retrying verbose ..."
              make -j1 V=s
            fi
          fi

          DEVICE_NAME=$(grep -oP 'CONFIG_TARGET.*DEVICE_\K[^=]+(?=y)' .config | head -n1 || true)
          [ -z "$DEVICE_NAME" ] && DEVICE_NAME=unknown
          FILE_DATE=$(date +"%Y%m%d%H%M")
          echo "✅ Device Name: $DEVICE_NAME"
          echo "📅 File Date: $FILE_DATE"

          {
            echo "DEVICE_NAME=$DEVICE_NAME"
            echo "FILE_DATE=$FILE_DATE"
          } >> "$GITHUB_ENV"

          {
            echo "deviceName=$DEVICE_NAME"
            echo "fileDate=$FILE_DATE"
            echo "status=success"
          } >> "$GITHUB_OUTPUT"

      - name: Check Disk Space (After Compilation)
        run: |
          echo "💾 Disk Space After Compilation:"
          df -hT

      # ====================== Output Processing ======================
      - name: Upload Bin Directory
        if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt_bin_${{ env.DEVICE_NAME }}_${{ env.FILE_DATE }}
          path: openwrt/bin

      - name: Prepare Firmware Files
        id: prepare
        if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
        run: |
          cd openwrt/bin/targets/*/*
          echo "📦 Preparing firmware files..."
          rm -rf packages
          echo "FIRMWARE=$PWD" >> "$GITHUB_ENV"
          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: Upload Firmware Files
        if: steps.prepare.outputs.status == 'success' && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt_firmware_${{ env.DEVICE_NAME }}_${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE }}

      - name: Generate Release Information
        id: release_info
        if: env.UPLOAD_RELEASE == 'true' && !cancelled()
        run: |
          cd openwrt

          DEVICE_MODEL=$(grep 'CONFIG_TARGET_PROFILE=' .config | awk -F'"' '{print $2}' | sed 's/^DEVICE_//')
          [ -z "$DEVICE_MODEL" ] && DEVICE_MODEL="unknown_device"

          TARGET_ARCH=$(grep 'CONFIG_TARGET_ARCH_PACKAGES=' .config | awk -F'"' '{print $2}')
          [ -z "$TARGET_ARCH" ] && TARGET_ARCH="unknown_arch"

          TARGET_BOARD=$(grep 'CONFIG_TARGET_BOARD=' .config | awk -F'"' '{print $2}')
          TARGET_SUBTARGET=$(grep 'CONFIG_TARGET_SUBTARGET=' .config | awk -F'"' '{print $2}')
          DEVICE_INFO="${TARGET_BOARD}/${TARGET_SUBTARGET}"

          PLUGINS=$(grep '^CONFIG_PACKAGE_luci-app-[a-z-]*=y$' .config \
                    | sed 's/^CONFIG_PACKAGE_//;s/=y$//' | sort)

          RELEASE_TAG="$(date +"%Y.%m.%d-%H%M")-${DEVICE_INFO}-${DEVICE_MODEL}-${TARGET_ARCH}"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

          {
            echo "### 🚀${DEVICE_MODEL}-${DEFAULT_HOSTNAME} Firmware"
            echo ""
            echo "- 🌐Admin URL: ${LAN_IP}"
            echo "- 🔑Login: root"
            echo "- 🔒Password: none"
            echo "- 📋Device Info: ${DEVICE_INFO}"
            echo "- 🖥️Device Model: ${DEVICE_MODEL}"
            echo "- 🏗️Device Arch: ${TARGET_ARCH}"
            echo "- 💿System Version: ${SYSTEM_VERSION}"
            echo "- ⚙️Kernel Version: ${KERNEL_VERSION}"
            echo ""
            echo "#### 📦Plugins"
            echo '```'
            if [ -n "$PLUGINS" ]; then
              i=0
              while IFS= read -r p; do
                i=$((i + 1))
                echo "${i}. ${p}"
              done <<< "$PLUGINS"
            else
              echo "none"
            fi
            echo '```'
            echo ""
            echo "#### 🔧Build Information"
            echo "- Build Time: $(date +"%Y-%m-%d %H:%M:%S %Z")"
            echo "- Source URL: ${REPO_URL}"
            echo "- Source Branch: ${REPO_BRANCH}"
          } > ../release_content.txt

          echo "======= release_content.txt ======="
          cat ../release_content.txt
          echo "==================================="

          echo "📝 Release information generated"
          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.release_info.outputs.status == 'success' && !cancelled()
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.release_info.outputs.release_tag }}
          body_path: release_content.txt
          files: ${{ env.FIRMWARE }}/*

      # ====================== Cleanup Phase ======================
      - name: Cleanup Old Workflow Runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 3
          keep_minimum_runs: 3

      - name: Cleanup Old Releases
        if: env.UPLOAD_RELEASE == 'true' && !cancelled()
        uses: dev-drprasad/delete-older-releases@v0.3.4
        with:
          keep_latest: 3
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
